name: Live AI benchmark

'on':
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-ai-benchmark
  cancel-in-progress: false

jobs:
  live-ai-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: live-smoke
    env:
      OPENAI_API_KEY: ${{ secrets.ARI_OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6
      SCENARIO_COUNT: '44'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - name: Synchronize locked API dependencies
        working-directory: apps/api
        run: uv sync --locked
      - name: Confirm deterministic gates for all 44 cases
        working-directory: apps/api
        run: >-
          uv run python -m release_intelligence.benchmark.runner
          --catalog ../../benchmarks/scenarios/catalog.yaml
          --output "${RUNNER_TEMP}/deterministic-benchmark.json"
      - name: Run bounded live structured-output checks
        working-directory: apps/api
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY"
          test "$OPENAI_MODEL" = "gpt-5.6"
          uv run python - <<'PY'
          import asyncio
          import json
          import math
          import os
          import statistics
          import time
          from pathlib import Path

          import yaml
          from openai import AsyncOpenAI


          async def main() -> None:
              catalog = yaml.safe_load(
                  Path("../../benchmarks/scenarios/catalog.yaml").read_text()
              )
              scenarios = sorted(catalog["scenarios"], key=lambda item: item["id"])
              assert len(scenarios) == int(os.environ["SCENARIO_COUNT"]) == 44
              client = AsyncOpenAI(max_retries=0, timeout=15.0)
              latencies = []
              input_tokens = 0
              output_tokens = 0
              try:
                  for scenario in scenarios:
                      supplied = {
                          "scenario_id": scenario["id"],
                          "status": scenario["expected"]["status"],
                          "finding_count": len(scenario["expected"]["findings"]),
                      }
                      started = time.monotonic()
                      response = await client.responses.create(
                          model="gpt-5.6",
                          store=False,
                          timeout=15.0,
                          max_output_tokens=100,
                          input=[
                              {
                                  "role": "developer",
                                  "content": "Return only the supplied synthetic coordinates.",
                              },
                              {"role": "user", "content": json.dumps(supplied)},
                          ],
                          text={
                              "format": {
                                  "type": "json_schema",
                                  "name": "benchmark_coordinate",
                                  "strict": True,
                                  "schema": {
                                      "type": "object",
                                      "properties": {
                                          "scenario_id": {"type": "string"},
                                          "finding_count": {"type": "integer"},
                                      },
                                      "required": ["scenario_id", "finding_count"],
                                      "additionalProperties": False,
                                  },
                              }
                          },
                      )
                      observed = json.loads(response.output_text)
                      assert observed == {
                          "scenario_id": supplied["scenario_id"],
                          "finding_count": supplied["finding_count"],
                      }
                      latencies.append((time.monotonic() - started) * 1000)
                      input_tokens += response.usage.input_tokens
                      output_tokens += response.usage.output_tokens
              finally:
                  await client.close()

              ordered = sorted(latencies)
              percentile = lambda p: ordered[max(math.ceil(p * len(ordered)) - 1, 0)]
              aggregate = {
                  "aggregate": True,
                  "model": "gpt-5.6",
                  "scenario_count": len(ordered),
                  "success_count": len(ordered),
                  "p50_ms": round(statistics.median(ordered), 3),
                  "p95_ms": round(percentile(0.95), 3),
                  "input_tokens": input_tokens,
                  "output_tokens": output_tokens,
              }
              output = Path(os.environ["RUNNER_TEMP"]) / "live-ai-aggregate.json"
              output.write_text(json.dumps(aggregate, sort_keys=True) + "\n")


          asyncio.run(main())
          PY
      - name: Upload aggregate metrics only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-ai-aggregate
          path: ${{ runner.temp }}/live-ai-aggregate.json
          if-no-files-found: error
          retention-days: 14
